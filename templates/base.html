<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Barbearia JP | Urbano & Sofisticado{% endblock %}</title>
    
    <!-- Google Fonts Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-grafite: #0f172a;       /* Cinza Grafite Profundo */
            --card-grafite: #1e293b;     /* Cinza Grafite Superfície */
            --azul-petroleo: #0ea5e9;    /* Azul Petróleo Vibrante */
            --azul-hover: #0284c7;       /* Azul Escuro Hover */
            --branco-puro: #ffffff;
            --texto-cinza: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        body.high-contrast {
            --bg-grafite: #000000;
            --card-grafite: #111111;
            --azul-petroleo: #00ffff;
            --azul-hover: #00cccc;
            --branco-puro: #ffffff;
            --texto-cinza: #ffffff;
            --border-subtle: #ffffff;
        }

        body {
            background-color: var(--bg-grafite);
            background-image: radial-gradient(at 50% 0%, rgba(14, 165, 233, 0.12) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--branco-puro);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-view {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem 1.2rem;
            margin: auto;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            color: var(--branco-puro);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--azul-petroleo), #2563eb);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .btn-accessibility {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--texto-cinza);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-accessibility:hover {
            color: var(--branco-puro);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .glass-card {
            background-color: var(--card-grafite);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 1.6rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--azul-petroleo);
            margin-bottom: 0.4rem;
        }

        .form-label-custom {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--texto-cinza);
            margin-bottom: 0.5rem;
        }

        .form-control-custom, .form-select-custom {
            background-color: #0f172a;
            border: 1px solid var(--border-subtle);
            color: var(--branco-puro) !important;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control-custom:focus, .form-select-custom:focus {
            background-color: #0f172a;
            border-color: var(--azul-petroleo);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25);
            outline: none;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--azul-petroleo) 0%, var(--azul-hover) 100%);
            color: var(--branco-puro);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 14px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(14, 165, 233, 0.45);
            color: var(--branco-puro);
        }

        .btn-whatsapp-custom {
            background: #25D366;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }
        .btn-whatsapp-custom:hover {
            background: #22bf5b;
            color: white;
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.45);
        }

        .btn-secondary-custom {
            background: rgba(255, 255, 255, 0.05);
            color: var(--texto-cinza);
            border: 1px solid var(--border-subtle);
            font-weight: 600;
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 0.8rem;
            transition: all 0.2s;
        }
        .btn-secondary-custom:hover {
            color: var(--branco-puro);
            background: rgba(255, 255, 255, 0.1);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }
        .btn-check-slot { display: none; }
        .slot-label {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--branco-puro);
            padding: 10px 0;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .slot-label:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-check-slot:checked + .slot-label {
            background: var(--azul-petroleo);
            border-color: var(--azul-petroleo);
            color: white;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
        }

        .alert-custom {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 14px;
            padding: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app-view">
        <header class="app-header">
            <a href="/" class="brand-logo">
                <span class="brand-badge"><i class="bi bi-scissors"></i></span>
                Barbearia JP
            </a>
            <button class="btn-accessibility" onclick="document.body.classList.toggle('high-contrast')">
                <i class="bi bi-circle-half me-1"></i> Contraste
            </button>
        </header>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert-custom">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% extends "base.html" %}

{% block content %}
<div class="text-center mb-4">
    <div class="section-label">Estilo Urbano & Moderno</div>
    <h1 class="fw-bold fs-3 mb-1">Agende seu Estilo</h1>
    <p class="text-secondary small">Escolha o corte moderno e a data ideal</p>
</div>

<div class="glass-card">
    <form action="/" method="POST">
        <div class="mb-4">
            <label for="servico_id" class="form-label-custom">CORTE OU TRATAMENTO</label>
            <select class="form-select form-select-custom" id="servico_id" name="servico_id" required>
                {% for s in servicos %}
                    <option value="{{ s.id }}">
                        {{ s.nome }} — R$ {{ "%.2f"|format(s.preco) }} ({{ s.duracao_min }} min)
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label for="data_agendamento" class="form-label-custom">DATA DO AGENDAMENTO</label>
            <input type="date" class="form-control form-control-custom" id="data_agendamento" name="data_agendamento" value="{{ data_hoje }}" min="{{ data_hoje }}" required>
        </div>

        <button type="submit" class="btn-action">
            <span>Ver Horários Disponíveis</span>
            <i class="bi bi-arrow-right"></i>
        </button>
    </form>
</div>
{% endblock %}
